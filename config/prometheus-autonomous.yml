global:
  scrape_interval: 15s

scrape_configs:
  - job_name: aiops-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["aiops-server:9900"]
  - job_name: ops-executor
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ops-executor:18091"]
  - job_name: demo-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["demo-service:18080"]
